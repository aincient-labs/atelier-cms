name: Release image

# Publishes the PUBLIC appliance image to GHCR from the public artifact repo.
#
#   push to main   → :edge        + :sha-<short>   (rolling build; every deploy)
#   push tag v*    → :v1.2.3      + :latest        (pinned release)
#   manual         → workflow_dispatch (publishes whatever ref it's run on)
#
# All three paths produce a native multi-arch (amd64+arm64) manifest.
#
# This repo (aincient-labs/atelier-cms) is the deterministic, history-free snapshot
# of the private aincient-labs/cms produced by the umbrella's bin/deploy-atelier.
# The image is built and published FROM HERE so the public package's source is
# exactly the public tree — what you can read is what got built. The private
# dev repo (cms) keeps its fast PR gate (ci.yml); this workflow re-runs the full
# gate against the published tree before pushing.
#
# The publish is GATED on the smoke test (build → install → upgrade → rollback),
# which now runs on BOTH arches natively: a matrix fans the build/smoke job out
# to a native amd64 runner (ubuntu-latest) and a native arm64 runner
# (ubuntu-24.04-arm — free for public repos). Each runner builds + smoke-tests
# its own arch on real silicon (no QEMU emulation anywhere), then pushes its
# layers to GHCR BY DIGEST. A final `merge` job stitches the two digests into one
# multi-arch manifest and applies the tags. Both :edge and :vX.Y.Z are therefore
# native multi-arch (linux/amd64 + linux/arm64) via the same code path — the tag
# set is the only difference — so Apple-Silicon / arm64 hosts always pull a
# native image, on every build, not just tagged releases.
#
# Image: ghcr.io/aincient-labs/atelier-cms  (PUBLIC package — computed from
# github.repository below, so it always tracks this repo's name).
#
# The published manifest is signed with cosign in the merge job (our key pair;
# private key + password in the COSIGN_PRIVATE_KEY / COSIGN_PASSWORD secrets,
# public key committed as cosign.pub). The signature is stored in GHCR next to
# the image. Verification is opt-in for consumers (see the sign step for the
# exact `cosign verify` invocation).
#
# Secrets: COSIGN_PRIVATE_KEY + COSIGN_PASSWORD (image signing). Composer
# authenticates to the GitHub API with the built-in GITHUB_TOKEN (rate-limit
# avoidance only). FlowDrop resolves from public drupal.org — the old private
# FLOWDROP_TOKEN PAT is no longer needed.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Gate the publish on the same PHP Kernel tests CI runs (agent loop +
  # Commands). The smoke test only proves the container installs/upgrades/rolls
  # back; a logic regression that still boots cleanly would otherwise ship to
  # :edge. These are fast sqlite tests, so the extra lane costs little. Runs on
  # every push/tag — publish never happens without it green.
  kernel-tests:
    name: PHP Kernel tests (agent loop + Commands)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: gd, pdo_sqlite, sqlite3, mbstring, dom, xml, curl, intl, zip, bcmath, opcache
          coverage: none
          tools: composer:v2

      - name: Cache Composer downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      # Authenticate composer to the GitHub API via the built-in GITHUB_TOKEN so
      # Packagist dist zipballs (served from api.github.com) don't hit the 60/hr
      # anonymous rate limit. FlowDrop resolves from public drupal.org — no PAT.
      - name: Install dependencies
        env:
          COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ secrets.GITHUB_TOKEN }}"}}'
        run: composer install --no-interaction --no-progress --prefer-dist

      # The appliance image caches flowdrop as its own layer, which depends on it
      # installing to web/modules/engine. composer/installers has no glob, so a
      # new flowdrop package would silently fall back to contrib and undo that.
      - name: Assert the engine layer tier is intact
        run: bash docker/tests/assert-engine-tier.sh

      # Functional (BrowserTestBase) tests in the sweep need a real HTTP server
      # serving the docroot (must start FROM the docroot so the router's
      # DOCUMENT_ROOT resolves index.php).
      - name: Start PHP server for Functional tests
        working-directory: web
        run: php -S 127.0.0.1:8888 .ht.router.php &>/tmp/php-server.log &

      - name: Run Kernel tests
        env:
          SIMPLETEST_BASE_URL: http://127.0.0.1:8888
        run: composer test

  # Guards the appliance's data-safety net: the failure-triggered rollback
  # branches (failed updatedb / config:import / unhealthy upgrade → snapshot
  # restore + abort) that smoke.sh's happy-path scenario can't exercise. Fast
  # (bats + mock drush, no image build), so it fails before the expensive build.
  converge-unit:
    name: Converge unit tests (bats)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # run.sh executes the suite in the bats/bats image; Docker is preinstalled.
      - name: Run converge bats suite
        run: bash docker/tests/run.sh

  # Build + smoke-test each arch on its OWN native runner (no QEMU), then push
  # that arch's layers to GHCR by digest. The two arches run in parallel; the
  # `merge` job below assembles them into one manifest. fail-fast:false so a
  # flake on one arch still lets the other finish and surfaces its own failure.
  build:
    name: Build + smoke (${{ matrix.arch }})
    needs: [kernel-tests, converge-unit]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, platform: linux/amd64, runner: ubuntu-latest }
          # Native arm64 — free for public repos. Replaces the old QEMU emulation
          # path, so arm64 builds at native speed and is smoke-tested for real.
          - { arch: arm64, platform: linux/arm64, runner: ubuntu-24.04-arm }
    steps:
      # fetch-depth: 0 is load-bearing, not caution. A rolling build stamps itself
      # with the release it descends from (`git describe --tags` below), and a
      # shallow clone carries no tags — the stamp would silently fall back to
      # 0.0.0 and every edge install would look older than every floor.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # No setup-qemu-action: each arch builds on its own native silicon.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Expose the Actions cache runtime token to plain `run:` steps so smoke.sh's
      # raw `docker buildx build --cache-to type=gha` can reach the cache backend
      # (these vars exist in the job but aren't exported to shell steps by default).
      - name: Expose GHA cache to buildx
        uses: actions/github-script@v7
        with:
          script: |
            // ACTIONS_RESULTS_URL + ACTIONS_CACHE_SERVICE_V2 are what select the v2
            // cache service. Without them BuildKit falls back to the RETIRED v1
            // endpoint (artifactcache.actions.githubusercontent.com), which answers
            // with an HTML error page; the import dies on "failed to parse error
            // response 400: <h2>Our services aren't available right now</h2>" and
            // --cache-to's ignore-error=true swallows the export failure. Result:
            // every build was a cold build. Verified on release run 32186515829 —
            // zero CACHED steps, ImageMagick recompiled from source each time.
            for (const name of [
              'ACTIONS_CACHE_URL',
              'ACTIONS_CACHE_SERVICE_V2',
              'ACTIONS_RESULTS_URL',
              'ACTIONS_RUNTIME_TOKEN',
            ]) {
              core.exportVariable(name, process.env[name] || '');
            }
            // Warn (don't fail — forked-PR runs legitimately lack these) so the
            // next time GitHub moves the endpoint it shows up in the run summary
            // instead of costing eight minutes a build in silence.
            if (!process.env.ACTIONS_RESULTS_URL) {
              core.warning('ACTIONS_RESULTS_URL is unset — buildx will fall back to the retired v1 cache service and every layer will rebuild.');
            }

      # Builds aincient/cms:smoke for THIS arch (gha-cached, per-arch scope) and
      # runs install → upgrade → rollback against a real container on native
      # silicon. Exits non-zero on any failure, which fails the job before
      # anything is pushed. The cached vendor (composer) + apt layers are reused
      # across runs. Per-arch cache scope keeps the two arches from clobbering
      # each other's layers.
      - name: Smoke-test the appliance
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AINCIENT_BUILD_CACHE: gha
          AINCIENT_BUILD_CACHE_SCOPE: appliance-${{ matrix.arch }}
        run: bash docker/tests/smoke.sh

      # The extension list stamped as dev.atelier.extensions (see the end of
      # docker/Dockerfile). Read out of the image smoke.sh just built, because
      # only the built image knows what it actually ships — composer decides,
      # not the repository. Non-core only: the whole tree is ~850 names / 18 KB
      # of metadata, and core extensions don't disappear between our releases
      # without a Drupal major, which the upgrade floor already gates.
      #
      # Cheap and non-fatal in shape: an empty value stamps an empty label, which
      # the manager reads as "unknown" and stands aside on — never as "this image
      # ships nothing", which would condemn every module on every site.
      - name: Collect the shipped extension list
        run: |
          set -euo pipefail
          EXT="$(docker run --rm --entrypoint sh aincient/cms:smoke -c \
            "find /opt/drupal/web -name '*.info.yml' -not -path '/opt/drupal/web/core/*' \
             | sed -e 's|.*/||' -e 's/\.info\.yml\$//' | sort -u | paste -sd, -")"
          if [ -z "$EXT" ]; then
            echo "no extensions found in the built image — refusing to stamp an empty list" >&2
            exit 1
          fi
          echo "ATELIER_EXTENSIONS=${EXT}" >> "$GITHUB_ENV"
          echo "stamping $(printf '%s' "$EXT" | tr ',' '\n' | wc -l) shipped extensions" >> "$GITHUB_STEP_SUMMARY"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Push THIS arch to GHCR by digest (no tag yet — tags are applied by the
      # merge job). Every layer cache-hits from the smoke build above (same
      # per-arch scope), so this is a push-only step, not a rebuild — the
      # published bytes are the smoke-validated bytes. push-by-digest lets the
      # merge job assemble a manifest list from the two arches' digests.
      #
      # composer install inside the Docker build authenticates to the GitHub API
      # via the same BuildKit secret the Dockerfile + smoke build use
      # (id=composer_github_token), fed the built-in GITHUB_TOKEN.
      # Reproducible layer digests. Without this, every built layer records its
      # files' build-time mtimes, so a build-cache MISS (GHA's 10 GB LRU evicts
      # the vendor/apt layers, or a cancel-in-progress aborts the cache export)
      # republishes the big core+contrib+vendor (~75 MB) and ImageMagick (~54 MB)
      # layers under NEW digests even though their contents are byte-identical —
      # and every appliance re-pulls ~130 MB it already has. rewrite-timestamp
      # caps all file mtimes in the exported layers at SOURCE_DATE_EPOCH, so
      # identical content always yields an identical digest regardless of when or
      # whether it was cached. SOURCE_DATE_EPOCH is a FIXED constant on purpose:
      # tie it to the build time and the whole image would re-digest every deploy,
      # defeating the point. Only change it to force a global re-layer.
      - name: Push by digest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_DATE_EPOCH: '1704067200'  # 2024-01-01T00:00:00Z — keep constant
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          # The build stamp baked into the image (ENV + OCI labels; see the end of
          # docker/Dockerfile). Mirrors the tag logic in the merge job below: a
          # tagged release is stamped with the tag a user can actually pull.
          #
          # A ROLLING BUILD IS STAMPED `<last release tag>+edge.<sha7>` — semver
          # build metadata on the newest release tag reachable from this commit.
          # It used to be `edge+<sha7>`, which has no position in the version
          # order, so the upgrade floor structurally could not gate an edge
          # install — the exact population most exposed to a release that drops a
          # module (DECISIONS 0353, plans/channel-hardening.md). This form is
          # comparable and conservative: the build provably contains everything
          # its base release shipped, and the unreleased work on top counts for
          # nothing. The sha7 survives, so an :edge bug report is still locatable
          # to an exact commit. Deliberately the SAME string a user sees on
          # /admin/reports/status.
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            ATELIER_VERSION="${{ github.ref_name }}"
          else
            # No reachable tag (a fork, or before the first release) → v0.0.0,
            # which is below every floor and so fails safe rather than passing one.
            BASE="$(git describe --tags --match 'v[0-9]*' --abbrev=0 2>/dev/null || echo v0.0.0)"
            ATELIER_VERSION="${BASE}+edge.${GITHUB_SHA::7}"
          fi
          echo "stamping ATELIER_VERSION=${ATELIER_VERSION}" >> "$GITHUB_STEP_SUMMARY"
          # The upgrade floor, READ FROM THE FILE rather than typed here. The
          # same value is baked into the image at /etc/atelier/upgrade-floor,
          # where converge.sh enforces it; this build-arg only stamps it as a
          # LABEL, which is what lets the manager read an image's floor from the
          # registry WITHOUT pulling it and plan a stepped upgrade. Deriving both
          # from one file is what keeps the enforced floor and the advertised
          # floor from ever disagreeing.
          ATELIER_UPGRADE_FLOOR="$(sed -e 's/#.*//' -e '/^[[:space:]]*$/d' docker/upgrade-floor | head -1 | tr -d '[:space:]')"
          if [[ ! "$ATELIER_UPGRADE_FLOOR" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "docker/upgrade-floor must hold one bare X.Y.Z; got '${ATELIER_UPGRADE_FLOOR}'" >&2
            exit 1
          fi
          echo "stamping ATELIER_UPGRADE_FLOOR=${ATELIER_UPGRADE_FLOOR}" >> "$GITHUB_STEP_SUMMARY"
          # These four build-args are the ONLY inputs that differ from the
          # smoke-validated build above, and they feed zero-byte metadata layers
          # at the very end of the Dockerfile — so every substantive layer still
          # cache-hits from smoke.sh and the published bytes remain the
          # smoke-validated bytes. ATELIER_EXTENSIONS was itself read out of that
          # same smoke image, so the list describes the bytes being published.
          docker buildx build \
            --secret "id=composer_github_token,env=GITHUB_TOKEN" \
            --cache-from "type=gha,scope=appliance-${{ matrix.arch }}" \
            --build-arg "ATELIER_VERSION=${ATELIER_VERSION}" \
            --build-arg "ATELIER_REVISION=${GITHUB_SHA}" \
            --build-arg "ATELIER_UPGRADE_FLOOR=${ATELIER_UPGRADE_FLOOR}" \
            --build-arg "ATELIER_EXTENSIONS=${ATELIER_EXTENSIONS}" \
            -f docker/Dockerfile \
            --output "type=image,name=${IMAGE},push-by-digest=true,name-canonical=true,push=true,rewrite-timestamp=true" \
            --metadata-file /tmp/meta.json \
            .
          mkdir -p /tmp/digests
          digest="$(jq -r '."containerimage.digest"' /tmp/meta.json)"
          touch "/tmp/digests/${digest#sha256:}"
          echo "pushed ${IMAGE}@${digest} (${{ matrix.platform }})" >> "$GITHUB_STEP_SUMMARY"

      # Each arch uploads a marker file named for its image digest; the merge job
      # downloads both to reconstruct the digest list.
      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Assemble the two per-arch digests into one multi-arch manifest and apply the
  # tags. This is the only place tags are set, so :edge and :vX.Y.Z share one
  # code path — the ref decides the tag set, nothing else.
  merge:
    name: Merge manifest + tag
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Keyless signing (below) needs the cosign binary; the signature is minted
      # against the GHCR login above.
      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      # github.repository is already owner/repo (aincient-labs/atelier-cms); lowercase
      # it defensively for GHCR so this publishes ghcr.io/aincient-labs/atelier-cms
      # without hardcoding the name. imagetools create builds the manifest list
      # from the per-arch digests (no rebuild — pure registry-side assembly).
      #
      #   v* tag         → :vX.Y.Z + :latest
      #   main / dispatch → :edge   + :sha-<short>
      - name: Create + push multi-arch manifest
        id: manifest
        working-directory: /tmp/digests
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAGS=("${{ github.ref_name }}" "latest")
          else
            TAGS=("edge" "sha-${GITHUB_SHA::7}")
          fi
          tag_args=(); for t in "${TAGS[@]}"; do tag_args+=(-t "${IMAGE}:${t}"); done
          docker buildx imagetools create "${tag_args[@]}" \
            $(printf "${IMAGE}@sha256:%s " *)
          docker buildx imagetools inspect "${IMAGE}:${TAGS[0]}"
          # The manifest-list digest is what we sign — one signature covers every
          # tag pointing at it (all tags above share this digest). Hand it to the
          # sign step below.
          DIGEST="$(docker buildx imagetools inspect "${IMAGE}:${TAGS[0]}" --format '{{.Manifest.Digest}}')"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "${IMAGE}:${TAGS[0]} (linux/amd64, linux/arm64 — native, smoke-validated)" >> "$GITHUB_STEP_SUMMARY"

      # Cosign signature with our own key pair. The private key + its password
      # are repo/org secrets (COSIGN_PRIVATE_KEY, COSIGN_PASSWORD); the matching
      # public key ships in this repo as cosign.pub. The signature is stored
      # alongside the image in GHCR, so pulling needs nothing extra. Verification
      # is opt-in for consumers:
      #   cosign verify --key cosign.pub ghcr.io/aincient-labs/atelier-cms:latest
      - name: Sign the manifest
        env:
          IMAGE: ${{ steps.manifest.outputs.image }}
          DIGEST: ${{ steps.manifest.outputs.digest }}
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          set -euo pipefail
          cosign sign --yes --key env://COSIGN_PRIVATE_KEY "${IMAGE}@${DIGEST}"
          echo "Signed ${IMAGE}@${DIGEST} (cosign key)" >> "$GITHUB_STEP_SUMMARY"
