    _disable_route_normalizer: 'TRUE'
    _auth: ['cookie', 'basic_auth']

# The stored schema for an existing page — the "edit this page" entry point.
aincient_studio_content.page_schema:
  path: '/atelier/page/{node}/schema'
  defaults:
    _controller: '\Drupal\aincient_studio_content\Controller\PageController::pageSchema'
  methods: [GET]
  requirements:
    _permission: 'use aincient studio content'
  options:
    # JSON/data API for the console SPA — never let a (future) redirect-module
    # route normalizer 301 these: a 301 on a POST drops the body and breaks the
    # call. Language is always an explicit `langcode` param, never negotiated.
    _disable_route_normalizer: 'TRUE'
    _auth: ['cookie', 'basic_auth']
    parameters:
      node:
        type: 'entity:node'

# Flip a page translation to its OWN (asymmetric) layout — copy-on-write. Gated
# by the divergence permission (it detaches the translation from source layout
# edits). Body: { "langcode": "<lc>" }.
aincient_studio_content.page_diverge:
  path: '/atelier/page/{node}/diverge'
  defaults:
    _controller: '\Drupal\aincient_studio_content\Controller\PageController::diverge'
  methods: [POST]
  requirements:
    _permission: 'diverge aincient page layout'
    # Stamped by hand: the subscriber only stamps routes whose permission is
    # exactly the studio's, and this one carries its own governance permission
    # on top — but it is still this studio's write, and 403s with it off.
    _aincient_studio_enabled: 'content'
  options:
    # JSON/data API for the console SPA — never let a (future) redirect-module
    # route normalizer 301 these: a 301 on a POST drops the body and breaks the
    # call. Language is always an explicit `langcode` param, never negotiated.
    _disable_route_normalizer: 'TRUE'
    _auth: ['cookie', 'basic_auth']
    parameters:
      node:
        type: 'entity:node'

# Re-inherit the source layout for a translation (asymmetric → symmetric). Always
# allowed (re-inheriting is never a governance risk). Body: { "langcode": "<lc>" }.
aincient_studio_content.page_converge:
  path: '/atelier/page/{node}/converge'
  defaults:
    _controller: '\Drupal\aincient_studio_content\Controller\PageController::converge'
  methods: [POST]
  requirements:
    _permission: 'use aincient studio content'
  options:
    # JSON/data API for the console SPA — never let a (future) redirect-module
    # route normalizer 301 these: a 301 on a POST drops the body and breaks the
    # call. Language is always an explicit `langcode` param, never negotiated.
    _disable_route_normalizer: 'TRUE'
    _auth: ['cookie', 'basic_auth']
    parameters:
      node:
        type: 'entity:node'

