# The Content studio's editing routes (plans/studio-modules.md Phase E.4,
# DECISIONS 0435). Moved out of `aincient_pages` with their PATHS unchanged — the
# console's page-state store fetches by path — and their route names re-homed
# under this module. Every route here carried `use aincient studio content`
# alone, which by the Phase A rule made it this studio's: the route subscriber
# stamps `_aincient_studio_enabled: content`, so a switched-off Content studio
# 403s the whole editing surface. What they call stays core — PageStore,
# BlockStore, NodeModeration, EditLock and the component catalog live in
# `aincient_pages`, because a page must keep rendering, exporting and being
# audited (Checks reads the same draft through the shared lock routes) with this
# studio off.
#
# NOT here, deliberately: the editor-lock trio (`content+checks` — shared), the
# unified reference API (behind the kit's <ReferenceField>, used by every rail)
# and media upload / token resolution (the picker and the Presence cards). They
# stay in `aincient_pages.routing.yml`.

# ── Pages ───────────────────────────────────────────────────────────────────

# Apply the page agent's ops to the working draft (PageStore::applyOps). No write.
aincient_studio_content.page_apply:
  path: '/atelier/page/apply'
  defaults:
    _controller: '\Drupal\aincient_studio_content\Controller\PageController::apply'
  methods: [POST]
  requirements:
    _permission: 'use aincient studio content'
  options:
    # JSON/data API for the console SPA — never let a (future) redirect-module
    # route normalizer 301 these: a 301 on a POST drops the body and breaks the
    # call. Language is always an explicit `langcode` param, never negotiated.
    _disable_route_normalizer: 'TRUE'
    _auth: ['cookie', 'basic_auth']

# Render a draft page-schema to chrome-less HTML (studio iframe srcdoc). No write.
aincient_studio_content.page_preview:
  path: '/atelier/page/preview'
  defaults:
    _controller: '\Drupal\aincient_studio_content\Controller\PageController::preview'
  methods: [POST]
  requirements:
