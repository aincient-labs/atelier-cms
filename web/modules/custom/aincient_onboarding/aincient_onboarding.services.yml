services:
  aincient_onboarding.provider_connector:
    class: Drupal\aincient_onboarding\ProviderConnector
    arguments:
      - '@state'
      - '@config.factory'
      - '@aincient_core.inference.provider_inventory'
      - '@aincient_core.model_role_resolver'
  aincient_onboarding.provider_catalog:
    class: Drupal\aincient_onboarding\ProviderCatalog
    arguments:
      - '@aincient_core.inference.provider_inventory'
      - '@config.factory'
      - '@aincient_core.model_recommendations'
      - '@aincient_onboarding.provider_connector'
  aincient_onboarding.profile_applier:
    class: Drupal\aincient_onboarding\ProfileApplier
    arguments:
      - '@aincient_core.model_preset_resolver'
      - '@aincient_onboarding.provider_catalog'
      - '@aincient_core.model_role_resolver'
      - '@aincient_core.recommendation_source'
  aincient_onboarding.wizard_payload:
    class: Drupal\aincient_onboarding\WizardPayload
    arguments:
      - '@aincient_onboarding.provider_catalog'
      - '@aincient_core.model_preset_resolver'
      - '@aincient_core.recommendation_source'
      - '@aincient_core.model_role_resolver'
      - '@aincient_core.model_recommendations'
      - '@config.factory'
      - '@current_user'
      - '@logger.channel.aincient_onboarding'
  logger.channel.aincient_onboarding:
    parent: logger.channel_base
    arguments: ['aincient_onboarding']
