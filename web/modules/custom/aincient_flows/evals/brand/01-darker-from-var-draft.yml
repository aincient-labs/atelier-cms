#
#   before (draft)            | after (was, #36)            | after (fixed)
#   var(--color-yellow-100)   | oklch(0.45 0.10 40) brown   | a darker YELLOW
name: darker-from-var-draft
issue: 36
status: ideating
saved_tokens: {}
draft:
  brand-primary: var(--color-yellow-100)
  brand-primary-foreground: oklch(0.15 0 0)
ask: make primary darker
expect:
