name: rounder-moves-a-real-rung
issue: 38
status: guided
saved_tokens:
  radius_sm: 0px
  radius_md: 0px
  radius_lg: 0px
  radius_xl: 0px
  radius_2xl: 0px
  card_radius: 0px
  button_radius: 0px
  input_radius: 0px
ask: make the corners a bit rounder
expect:
