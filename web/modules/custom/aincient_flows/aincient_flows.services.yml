services:

  # Live-turn eval for the brand agent (`drush aincient:brand-eval`). Runs a
  # real brand_studio turn through aincient_chat's processor and reads the job
  # trail; cross-module services are resolved at run time (see the class).
  aincient_flows.brand_eval_runner:
    class: Drupal\aincient_flows\Eval\BrandEvalRunner
    arguments:
      - '@config.factory'
      - '@entity_type.manager'
      - '@account_switcher'
      - '@aincient_pages.brand'
      - '@aincient_pages.token_resolver'
      - '@aincient_pages.color_contrast'

  # Live-turn eval for the General assistant's docs answers (0525): real turns
  # through the console's processor (so the runtime docs check is measured),
  # judged against whole docs pages by an independent reasoning-role call.
  aincient_flows.docs_eval_judge:
    class: Drupal\aincient_flows\Eval\DocsEvalJudge
    arguments:
      - '@aincient_core.inference.gateway'
      - '@aincient_core.docs_corpus'
      - '@aincient_core.search_index'
  aincient_flows.docs_eval_runner:
    class: Drupal\aincient_flows\Eval\DocsEvalRunner
    arguments:
      - '@entity_type.manager'
      - '@account_switcher'
      - '@aincient_flows.docs_eval_judge'
