# The fixture PACK component (plans/byo-components.md W4): an ordinary SDC in
# an ordinary module, admitted purely through its atelier metadata below.
name: Spotlight
status: experimental
group: 'Atelier test pack'
description: 'One product shot beside a single claim.'
props:
  type: object
  properties:
    variant:
      type: string
      enum: [left, right]
      default: left
    tone:
      type: string
      enum: [default, muted, brand, inverted]
      default: default
    eyebrow: { type: string }
    heading: { type: string }
    claim: { type: string }
    cta_label: { type: string }
    cta_url: { type: string }
    image: { type: string }
thirdPartySettings:
  atelier:
    api: 1
    tier: section
    order: 45
    icon: ◈
    use: 'One product shot beside a single claim. Use once, below the hero.'
    props:
      variant: left|right
      tone: ''
      eyebrow: ''
      heading: ''
      claim: ''
      cta_label: ''
      cta_url: ''
      image: ''
    prop_vocab:
      claim: 'the single bold claim sentence shown beside the product shot.'
    image_props:
      image: { style: large }
    stylesheet: assets/atelier-test-pack.css
    # Phase 4: the declared render fixture — gallery input, Phase 5 few-shot,
    # visual-regression baseline. Story-shaped (name?, props, slots?).
    examples:
      - name: default
        props:
          variant: left
          tone: default
          eyebrow: 'New'
          heading: 'The claim, made visible'
          claim: 'One product shot beside a single claim.'
          cta_label: 'See it'
          cta_url: 'https://example.com'
