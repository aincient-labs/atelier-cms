name: Grid
status: experimental
group: 'AIncient Layout'
description: 'A bounded grid of equal card tiles (one level deep, no nesting). columns reflows the tiles.'
props:
  type: object
  properties:
    tone:
      type: string
      enum: [default, muted, brand, inverted]
      default: default
    eyebrow: { type: string }
    heading: { type: string }
    subheading: { type: string }
    columns:
      type: integer
      enum: [2, 3, 4]
      default: 3
    cards:
      type: array
      description: 'Array of { title, body, icon, image, cta_label, cta_url }. Each renders as a card tile.'
thirdPartySettings:
  atelier:
    api: 1
    tier: layout
    order: 10
    icon: ⊡
    rows:
      cards:
        image: image
        view_mode: card
    use: 'A bounded grid of equal "card" tiles — ONE level deep, never nested. Use for a homogeneous set that no named section fits. columns reflows the tiles.'
    props:
      tone: ''
      eyebrow: ''
      heading: ''
      subheading: ''
      columns: 2|3|4
      cards: '[{title,body,icon,image,cta_label,cta_url}]'
    # Preview fixtures for the Components studio (DECISIONS 0455) — page-schema props.
    examples:
      - name: 'Guesthouse rooms'
        props:
          eyebrow: 'Stay with us'
          heading: 'Six rooms, each with a view'
          subheading: 'All rooms include breakfast, linen and a parking space.'
          columns: 3
          cards:
            - title: 'Garden room'
              body: 'Ground floor, opening onto the orchard. Sleeps two.'
              image: 'placeholder:landscape'
              cta_label: 'Check dates'
              cta_url: '/rooms/garden'
            - title: 'Loft suite'
              body: 'Under the beams, with a reading nook and a deep bath.'
              image: 'placeholder:landscape'
              cta_label: 'Check dates'
              cta_url: '/rooms/loft'
            - title: 'Family room'
              body: 'A double and two singles, with space for a cot.'
              image: 'placeholder:landscape'
              cta_label: 'Check dates'
              cta_url: '/rooms/family'
      - name: 'Workshop resources'
        props:
          heading: 'Guides for new customers'
          columns: 2
          cards:
            - icon: '◆'
              title: 'Caring for oiled oak'
              body: 'How often to re-oil, which products to use and what to avoid.'
              cta_label: 'Read the guide'
              cta_url: '/guides/oiled-oak'
            - icon: '○'
              title: 'Delivery and assembly'
              body: 'What to expect on the day, and how to prepare the room.'
              cta_label: 'Read the guide'
              cta_url: '/guides/delivery'
      - name: 'Florist occasions'
        props:
          heading: 'Flowers for every occasion'
          columns: 4
          cards:
            - title: 'Weddings'
              image: 'placeholder:portrait'
              cta_url: '/occasions/weddings'
            - title: 'Sympathy'
              image: 'placeholder:portrait'
              cta_url: '/occasions/sympathy'
            - title: 'Birthdays'
              image: 'placeholder:portrait'
              cta_url: '/occasions/birthdays'
            - title: 'Workplaces'
              image: 'placeholder:portrait'
              cta_url: '/occasions/workplaces'
