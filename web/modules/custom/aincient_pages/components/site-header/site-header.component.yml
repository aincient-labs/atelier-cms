name: 'Site header'
status: experimental
group: 'AIncient Chrome'
description: 'Brand header shown on every page: logo or name + navigation.'
props:
  type: object
  properties:
    name: { type: string }
    logo_url: { type: string }
    nav:
      type: array
      description: 'Array of { label, url }.'
    language_links:
      type: array
      description: 'Array of { langcode, label, native, url, active, translated } language-switch links. Rendered only when the site has 2+ languages; empty otherwise. Up to 3 languages render inline as codes; 4+ collapse into a dropdown of endonyms. `translated: false` marks a language the current page has no translation for — still linked, but signposted.'
    logo_position:
      type: string
      enum: [left, center]
      default: left
      description: 'Where the logo/wordmark sits in the bar.'
    logo_size:
      type: string
      enum: [small, medium, large]
      default: medium
      description: 'How tall the logo renders: small = 1.5rem, medium = 2rem (default), large = 3rem.'
    sticky:
      type: boolean
      default: true
      description: 'Stick the header to the top of the viewport on scroll.'
    nav_alignment:
      type: string
      enum: [end, center, start]
      default: end
      description: 'How the nav links align in the remaining bar space (left logo only).'
thirdPartySettings:
  atelier:
    api: 1
    tier: chrome
    order: 10
