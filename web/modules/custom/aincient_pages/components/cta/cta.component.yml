name: 'CTA Band'
status: experimental
group: 'AIncient Landing'
description: 'A closing call-to-action band. Usually brand-toned to stand out.'
props:
  type: object
  properties:
    tone:
      type: string
      enum: [default, muted, brand, inverted]
      default: brand
    heading: { type: string }
    subheading: { type: string }
    cta_label: { type: string }
    cta_url: { type: string }
thirdPartySettings:
  atelier:
    api: 1
    tier: section
    order: 160
    icon: ◈
    use: 'Closing call-to-action band; usually tone "brand". Give the visitor one action — close every page with one.'
    props:
      tone: ''
      heading: ''
      subheading: ''
      cta_label: ''
      cta_url: ''
    # Preview fixtures for the Components studio (DECISIONS 0455) — page-schema props.
    examples:
      - name: 'Consultancy close'
        props:
          heading: 'Ready to see your numbers clearly?'
          subheading: 'Book a free 30-minute call and leave with one thing you can fix this month.'
          cta_label: 'Book a call'
          cta_url: '/contact'
      - name: 'Software trial'
        props:
          heading: 'Send your first invoice today'
          subheading: 'Free for 30 days, no card required.'
          cta_label: 'Start free trial'
          cta_url: '/pricing'
