name: Accordion
status: experimental
group: 'AIncient Landing'
description: 'A disclosure list whose panels hold RICH content blocks (not just text like faq) — a native <details> accordion, no JS. Panel bodies are pre-rendered by the renderer from a bounded set of child blocks (one level deep). tone sets the surface band.'
props:
  type: object
  properties:
    tone:
      type: string
      enum: [default, muted, brand, inverted]
      default: default
    eyebrow: { type: string }
    heading: { type: string }
    subheading: { type: string }
    exclusive:
      type: boolean
      default: false
      description: 'When true, at most one panel is open at a time (native <details name> grouping).'
    name:
      type: string
      description: 'Stable group name for exclusive <details> grouping — set by the renderer from the section slot id, not authored.'
    panels:
      type: array
      description: 'Array of { label, open, body_html } — body_html is the renderer-built HTML of the panel''s child blocks (see ACCORDION_BLOCKS). Authored as { label, open, blocks:[{component,props}] }; the renderer flattens blocks → body_html.'
thirdPartySettings:
  atelier:
    api: 1
    tier: section
    order: 130
    icon: ≡
    use: "A disclosure list whose panels hold RICH content, unlike faq's plain text. Each panel is a label + one or more content blocks. Use for layered detail: documentation, nested how-tos, spec breakdowns. Panels nest content blocks ONE level only — never a section or another container. exclusive = at most one panel open at a time. Allowed block components: markdown, image."
    props:
      tone: ''
      eyebrow: ''
      heading: ''
      subheading: ''
      exclusive: ''
      panels: '[{label,open,blocks:[{component,props}]}]'
    # Preview fixtures for the Components studio (DECISIONS 0455) — page-schema props.
    examples:
      - name: 'Getting started guide'
        props:
          eyebrow: 'Help centre'
          heading: 'Set up your account in three steps'
          subheading: 'Most teams are sending their first invoice within fifteen minutes.'
          exclusive: true
          panels:
            - label: '1. Add your business details'
              open: true
              blocks:
                - component: markdown
                  props:
                    markdown: "Open **Settings → Business** and fill in your company name, address and tax number. These appear on every invoice, so double-check the spelling.\n\nYou can upload your logo here too — a square PNG works best."
                - component: image
                  props:
                    image: 'placeholder:wide'
                    caption: 'The business settings screen.'
            - label: '2. Import your clients'
              open: false
              blocks:
                - component: markdown
                  props:
                    markdown: "Upload a CSV from your old tool, or add clients one by one. Required columns:\n\n- Name\n- Email\n- Billing address"
            - label: '3. Send your first invoice'
              open: false
              blocks:
                - component: markdown
                  props:
                    markdown: "Choose **New invoice**, pick a client and add line items. Hit *Send* and we email a PDF with a payment link. Questions? [Contact support](/support)."
