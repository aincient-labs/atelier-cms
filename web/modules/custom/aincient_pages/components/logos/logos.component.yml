name: Logos
status: experimental
group: 'AIncient Landing'
description: 'A quiet row of partner/customer logo marks ("trusted by").'
props:
  type: object
  properties:
    tone:
      type: string
      enum: [default, muted, brand, inverted]
      default: muted
    heading: { type: string }
    logos:
      type: array
      description: 'Array of { name, image, url }. image optional (falls back to the name as text).'
thirdPartySettings:
  atelier:
    api: 1
    tier: section
    order: 20
    icon: ▤
    image_props:
      image:
        style: medium
    use: 'A quiet row of partner/customer logos under the hero — instant "trusted by" credibility. One line of marks.'
    props:
      tone: ''
      heading: ''
      logos: '[{name,image,url}]'
    # Preview fixtures for the Components studio (DECISIONS 0455) — page-schema props.
    examples:
      - name: 'Software customers'
        props:
          heading: 'Trusted by teams at'
          logos:
            - name: 'Brightwater Studio'
              image: 'placeholder:logo-1'
              url: '/customers/brightwater'
            - name: 'Halden Clinics'
              image: 'placeholder:logo-2'
              url: '/customers/halden'
            - name: 'Okafor and Lee'
              image: 'placeholder:logo-3'
              url: '/customers/okafor-lee'
            - name: 'Marlow Coffee'
              image: 'placeholder:logo-4'
              url: '/customers/marlow'
            - name: 'Fernhill Dental'
              image: 'placeholder:logo-5'
              url: '/customers/fernhill'
      - name: 'Bakery suppliers'
        props:
          heading: 'Flour and dairy from local partners'
          logos:
            - name: 'Elbmühle'
              image: 'placeholder:logo-1'
            - name: 'Hollerhof Dairy'
              image: 'placeholder:logo-2'
            - name: 'Nordgrain'
              image: 'placeholder:logo-3'
