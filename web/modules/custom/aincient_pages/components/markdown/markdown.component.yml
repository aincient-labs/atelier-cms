name: Markdown
status: experimental
group: 'AIncient Landing'
description: 'A block of long-form body text authored in Markdown, rendered with a reading-optimised prose measure. tone sets the surface band.'
props:
  type: object
  properties:
    tone:
      type: string
      enum: [default, muted, brand, inverted]
      default: default
    # `bare` drops the section band + outer padding/measure so the block can be
    # embedded INSIDE a container (e.g. an accordion panel), where the parent
    # owns the surface and spacing. Set by the renderer for nested blocks, never
    # authored — it is NOT in ComponentCatalog::SECTIONS['markdown'] props, so a
    # top-level markdown can never select it.
    variant:
      type: string
      enum: [default, bare]
      default: default
    # Sanitised HTML supplied by the renderer (CommonMark + Xss::filterAdmin of
    # the page-schema's `markdown` source prop) — NOT authored directly. See
    # PageSpikeController::renderSection() and MarkdownRenderer.
    html:
      type: string
      description: 'Rendered, sanitised article HTML (built from the Markdown source).'
thirdPartySettings:
  atelier:
    api: 1
    tier: section
    order: 60
    icon: ≣
    use: 'A block of long-form body text authored in Markdown — headings, lists, links, bold/italic, blockquotes. Reach for it for free-form formatted copy that no structured section (hero/features/content/…) models. Rendered with a reading-optimised prose measure.'
    props:
      tone: ''
      markdown: ''
    # Preview fixtures for the Components studio (DECISIONS 0455) — page-schema props.
    examples:
      - name: 'Visiting the clinic'
        props:
          markdown: |
            ## Before your first visit

            Please arrive **ten minutes early** so we can complete a short health questionnaire together.

            ### What to bring

            - Comfortable clothing you can move in
            - Any recent scans or letters from your doctor
            - A list of medication you take regularly

            > Running late? Call us on 040 123 456 and we will do our best to keep your slot.

            Need to reschedule? You can change or cancel online up to 24 hours before — see [your appointments](/appointments).
