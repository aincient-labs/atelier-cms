name: Hero
status: experimental
group: 'AIncient Landing'
description: 'Top-of-page hero. The agent picks a variant + tone; copy is free.'
props:
  type: object
  properties:
    variant:
      type: string
      enum: [centered, split]
      default: centered
    tone:
      type: string
      enum: [default, muted, brand, inverted]
      default: default
    eyebrow: { type: string }
    heading: { type: string }
    subheading: { type: string }
    cta_label: { type: string }
    cta_url: { type: string }
    secondary_label: { type: string }
    secondary_url: { type: string }
slots:
  # The hero image, supplied by the renderer as a Rift responsive <picture>
  # render array (view mode "hero", 4x3) resolved from the page-schema's
  # `image` media token — NOT authored as a prop. Alt rides inside the picture
  # (sourced from the Media entity). See PageSpikeController::component().
  image:
    title: 'Hero image'
    description: 'Responsive <picture> built by the renderer from the image media token.'
thirdPartySettings:
  atelier:
    api: 1
    tier: section
    order: 10
    icon: ◆
    image_props:
      image:
        style: wide
        view_mode: hero
    use: 'Top-of-page opener; the only full-viewport section. Open every page with one, never stack two.'
    props:
      variant: centered|split
      tone: ''
      eyebrow: ''
      heading: ''
      subheading: ''
      cta_label: ''
      cta_url: ''
      secondary_label: ''
      secondary_url: ''
      image: ''
    # Preview fixtures for the Components studio (DECISIONS 0455) — page-schema props.
    examples:
      - name: 'Studio opener'
        props:
          variant: split
          eyebrow: 'Architecture · Hamburg'
          heading: 'Quiet buildings for busy lives'
          subheading: 'We design homes and small workplaces that age well — clear plans, honest materials, and light where you need it.'
          cta_label: 'See our work'
          cta_url: '/work'
          secondary_label: 'Book a call'
          secondary_url: '/contact'
          image: 'placeholder:landscape'
      - name: 'Bakery welcome'
        props:
          variant: centered
          eyebrow: 'Open daily from 7 am'
          heading: 'Sourdough, baked before sunrise'
          subheading: 'A neighbourhood bakery with slow-fermented loaves, seasonal pastries and coffee from a roaster down the street.'
          cta_label: 'Order for pickup'
          cta_url: '/order'
          secondary_label: 'Visit us'
          secondary_url: '/visit'
          image: 'placeholder:wide'
