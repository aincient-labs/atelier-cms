name: Content
status: experimental
group: 'AIncient Landing'
description: 'A prose block paired with an image (or text-only). variant places the image left/right.'
props:
  type: object
  properties:
    variant:
      type: string
      enum: [image-right, image-left, text-only]
      default: image-right
    tone:
      type: string
      enum: [default, muted, brand, inverted]
      default: default
    eyebrow: { type: string }
    heading: { type: string }
    subheading: { type: string }
    body: { type: string }
    cta_label: { type: string }
    cta_url: { type: string }
slots:
  # The paired image, supplied by the renderer as a Rift responsive <picture>
  # render array (view mode "content", 4x3) resolved from the page-schema's
  # `image` media token — NOT authored as a prop. Alt rides inside the picture
  # (sourced from the Media entity). See PageSpikeController::component().
  image:
    title: 'Content image'
    description: 'Responsive <picture> built by the renderer from the image media token.'
thirdPartySettings:
  atelier:
    api: 1
    tier: section
    order: 50
    icon: ¶
    image_props:
      image:
        view_mode: content
    use: 'A prose block paired with an image — explain one idea in depth. Alternate the image side (image-left/right) as you stack these; text-only drops the image.'
    props:
      variant: image-right|image-left|text-only
      tone: ''
      eyebrow: ''
      heading: ''
      subheading: ''
      body: ''
      image: ''
      cta_label: ''
      cta_url: ''
    # Preview fixtures for the Components studio (DECISIONS 0455) — page-schema props.
    examples:
      - name: 'Our approach'
        props:
          variant: image-right
          eyebrow: 'How we work'
          heading: 'Every project starts at the kitchen table'
          subheading: 'Before we draw a line, we listen.'
          body: 'We spend the first weeks understanding how you actually live — the morning rush, where the post piles up, which window gets the evening sun. The plan follows from that, not the other way round. You see sketches early and often, so nothing on site comes as a surprise.'
          image: 'placeholder:portrait'
          cta_label: 'Read about our process'
          cta_url: '/process'
      - name: 'Clinic team'
        props:
          variant: image-left
          eyebrow: 'Physiotherapy'
          heading: 'Care that fits around your week'
          body: 'Our four physiotherapists treat sports injuries, back pain and post-surgery recovery. Appointments run from early morning to late evening, and every first visit includes a full assessment and a written plan you can take home.'
          image: 'placeholder:landscape'
          cta_label: 'Book an appointment'
          cta_url: '/appointments'
      - name: 'Founder note'
        props:
          variant: text-only
          eyebrow: 'Our story'
          heading: 'Software we wanted to use ourselves'
          body: 'We started Ledgerline after years of watching small teams fight their invoicing tools. So we built the opposite: one screen, sensible defaults, and support from the people who wrote the code. Today more than two thousand businesses send their invoices with us.'
          cta_label: 'Meet the team'
          cta_url: '/about'
