name: 'Features'
status: experimental
group: 'AIncient Landing'
description: 'A heading plus a grid of feature cards (icon optional). columns reflow the cards.'
props:
  type: object
  properties:
    tone:
      type: string
      enum: [default, muted, brand, inverted]
      default: default
    eyebrow: { type: string }
    heading: { type: string }
    subheading: { type: string }
    columns:
      type: integer
      enum: [2, 3]
      default: 3
    features:
      type: array
      description: 'Array of [{icon,title,body,cta_label,cta_url}]. icon = emoji or short text glyph; cta_label/cta_url are optional.'
thirdPartySettings:
  atelier:
    api: 1
    tier: section
    order: 40
    icon: ⊞
    use: 'A heading plus a grid of feature cards. icon = ONE glyph/emoji (e.g. ✶ ◆ ⚡ 🚀). Each card may carry an optional cta_label + cta_url link. columns reflow the cards.'
    props:
      tone: ''
      eyebrow: ''
      heading: ''
      subheading: ''
      columns: 2|3
      features: '[{icon,title,body,cta_label,cta_url}]'
