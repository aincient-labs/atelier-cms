# Spike routes: render a hand-authored brief (simulating the agent's output).
aincient_pages.landing:
  path: '/spike/landing'
  defaults:
    _controller: '\Drupal\aincient_pages\Controller\PageSpikeController::render'
    brief: landing
    _title: 'AIncient — landing spike'
  requirements:
    _access: 'TRUE'

aincient_pages.blog:
  path: '/spike/blog'
  defaults:
    _controller: '\Drupal\aincient_pages\Controller\PageSpikeController::render'
    brief: blog
    _title: 'AIncient — blog spike'
  requirements:
    _access: 'TRUE'

# Component showcase: every placeable section + the grid layout container, so
# the full library can be eyeballed (and reskinned by the live brand) at once.
aincient_pages.showcase:
  path: '/spike/showcase'
  defaults:
    _controller: '\Drupal\aincient_pages\Controller\PageSpikeController::render'
    brief: showcase
    _title: 'AIncient — component showcase'
  requirements:
    _access: 'TRUE'

# Brand demo: a self-referential showcase that exercises the full token set
# across all tones — the canonical target for live brand preview.
aincient_pages.brand_demo:
  path: '/demo/brand'
  defaults:
    _controller: '\Drupal\aincient_pages\Controller\PageSpikeController::render'
    brief: brand-demo
    _title: 'AIncient — brand demo'
  requirements:
    _access: 'TRUE'

# The literal /favicon.ico every browser requests unconditionally: the
# operator-uploaded favicon if one is set (Globals studio), else the module's
# bundled default (the Atelier mark) — either way a cacheable 200 instead of the console-
# error 404. NOTE: reaching this route depends on the webserver forwarding a
# missing /favicon.ico to Drupal (DDEV nginx does; the appliance Dockerfile
# drops stock .htaccess's favicon exemption so Apache does too).
aincient_pages.favicon:
  path: '/favicon.ico'
  defaults:
    _controller: '\Drupal\aincient_pages\Controller\FaviconController::icon'
  methods: [GET]
  requirements:
    _access: 'TRUE'
  options:
    _disable_route_normalizer: 'TRUE'

# NOTE: aincient_page nodes render chrome-less at their OWN node canonical
# (/node/{nid} + pathauto alias) via PageRouteSubscriber, so metatag/pathauto
# apply natively. There is no separate /page route. Pages are edited through
# the chat console's page studio (preview/apply/save below), not a backend form.

# ── Identity studio API ─────────────────────────────────────────────────────
# /atelier/brand/{manifest,save,status} moved to the Identity studio module
# (web/modules/studio/aincient_brand, DECISIONS 0436): BrandRepository, the
# token registry, the preset catalog and the brand revisions stay here — the
# site renders its brand with the studio switched off — the editing surface and
# the brand agent are the studio's. The no-AI admin form + history stay below.

# ── Chrome studios API (chat console) ───────────────────────────────────────
# Shared persistence for the three surfaces the old Globals studio split into
# (DECISIONS 0372): Identity (design_system) writes the identity slice + logo
# layout knobs, Navigation & Pages (globals) the menus/routing/arrangement, and
# Settings (settings) the site email + privacy. All three edit a preview-only
# draft; preview renders it without persisting; save is the one deliberate write
# and MERGES by provided key, so each surface safely sends only its own slice.
# The `+` permission is OR: any of the three studios may reach these endpoints
# (the save logic is one shared merge, not re-cut per surface). Because the
# permission is shared, the studio switch stamps NO studio on them: they are
# core's, and stay here after `globals` + `settings` moved into
# `web/modules/studio/aincient_studio_site` (Phase E.3).

# Current chrome state + the editing vocabulary (layout enums, identity, menus).
aincient_pages.chrome_manifest:
  path: '/atelier/chrome/manifest'
  defaults:
    _controller: '\Drupal\aincient_pages\Controller\ChromeController::manifest'
  methods: [GET]
  requirements:
    _permission: 'use aincient studio globals+use aincient studio design_system+use aincient studio settings'
  options:
    _disable_route_normalizer: 'TRUE'
    _auth: ['cookie', 'basic_auth']

# Render the chrome around a placeholder body from the draft (iframe srcdoc). No write.
aincient_pages.chrome_preview:
  path: '/atelier/chrome/preview'
  defaults:
    _controller: '\Drupal\aincient_pages\Controller\ChromeController::preview'
  methods: [POST]
  requirements:
    _permission: 'use aincient studio globals+use aincient studio design_system+use aincient studio settings'
  options:
    _disable_route_normalizer: 'TRUE'
    _auth: ['cookie', 'basic_auth']

# Publish the chrome draft: layout + identity + reconcile the main/footer menus.
aincient_pages.chrome_save:
  path: '/atelier/chrome/save'
  defaults:
    _controller: '\Drupal\aincient_pages\Controller\ChromeController::save'
  methods: [POST]
  requirements:
    _permission: 'use aincient studio globals+use aincient studio design_system+use aincient studio settings'
  options:
    _disable_route_normalizer: 'TRUE'
    _auth: ['cookie', 'basic_auth']

# ── Components governance API ───────────────────────────────────────────────
# /atelier/constraint/{manifest,save} moved to the Components studio module
# (web/modules/studio/aincient_studio_components, DECISIONS 0431): the
# constraint config + its render-time application stay here, the editing
# surface is the studio's.

# NOTE: logo/favicon uploads no longer have bespoke endpoints — they go through
# the unified reference picker (/atelier/media/upload → a `media:<id>` token),
# and the token is persisted by chrome_save. (Library IA increment #3c.)

# ── Page studio API (chat console) ──────────────────────────────────────────
# The page + block EDITING routes (/atelier/page/{apply,preview,save,publish,…},
# /atelier/block/*) are the Content studio's and live in
# web/modules/studio/aincient_studio_content (plans/studio-modules.md Phase E.4):
# they carried `use aincient studio content` alone. What stays here is SHARED
# across studios — the editor lock (content + checks), the reference picker
# (every rail's <ReferenceField>) and the media upload / token resolution
# (the picker and the Presence cards) — plus PageStore itself: a page must keep
# rendering and exporting with the Content studio switched off.

# Editor-lock API (single-writer per node+language). Available to BOTH page-
# editing studios (content + checks) — the OR permission — because the lock and
# handover span them; the real floor is per-node update access, checked in the
# controller.
aincient_pages.page_lock_acquire:
  path: '/atelier/page/lock/acquire'
  defaults:
    _controller: '\Drupal\aincient_pages\Controller\LockController::acquire'
  methods: [POST]
  requirements:
    _permission: 'use aincient studio content+use aincient studio checks'
  options:
    _disable_route_normalizer: 'TRUE'
    _auth: ['cookie', 'basic_auth']

aincient_pages.page_lock_release:
  path: '/atelier/page/lock/release'
  defaults:
    _controller: '\Drupal\aincient_pages\Controller\LockController::release'
  methods: [POST]
  requirements:
    _permission: 'use aincient studio content+use aincient studio checks'
  options:
    _disable_route_normalizer: 'TRUE'
    _auth: ['cookie', 'basic_auth']

aincient_pages.page_lock_status:
  path: '/atelier/page/lock/status'
  defaults:
    _controller: '\Drupal\aincient_pages\Controller\LockController::status'
  methods: [GET]
  requirements:
    _permission: 'use aincient studio content+use aincient studio checks'
  options:
    _disable_route_normalizer: 'TRUE'
    _auth: ['cookie', 'basic_auth']

# Read-only revision graph for the console's Pages → History rail
# (plans/revision-graph-console.md). Beside the Content studio's
# /atelier/page/{node}/schema. Contrib revision_graph's builder, renderer-shaped
# (`refs`, palette + branchColors) with every `urls` stripped — the read-only
# gate is server-side. The per-node floor (`view all revisions`) + the
# aincient_page bundle check are in the controller. revision_graph is a SOFT
# dependency: absent module → 404.
aincient_pages.page_revisions:
  path: '/atelier/page/{node}/revisions'
  defaults:
    _controller: '\Drupal\aincient_pages\Controller\RevisionGraphController::revisions'
  methods: [GET]
  requirements:
    # History is a mode of the Content studio's preview: same permission as
    # opening it (page_schema), so StudioRouteSubscriber stamps
    # `_aincient_studio_enabled: content` and a switched-off studio 403s this.
    _permission: 'use aincient studio content'
    node: \d+
  options:
    _disable_route_normalizer: 'TRUE'
    _auth: ['cookie', 'basic_auth']
    parameters:
      node:
        type: 'entity:node'

# ── Unified reference API (chat console) ────────────────────────────────────
# One SEARCH + one DESCRIBE over every referenceable type (media, nodes, blocks —
# Users/Brand later), behind the studio's <ReferenceField> and the agent's
# find_reference tool. Pickers write back the type's text TOKEN (media:<id> /
# entity:node:<id> / block:<id>); resolve drives the in-field preview. Gated like
# the page endpoints.

# Search pickable references across types (?types=media,node,block&q=…).
aincient_pages.reference_search:
  path: '/atelier/reference/search'
  defaults:
    _controller: '\Drupal\aincient_pages\Controller\ReferenceController::search'
  methods: [GET]
  requirements:
    _permission: 'use aincient studio content'
  options:
    _disable_route_normalizer: 'TRUE'
    _auth: ['cookie', 'basic_auth']

# Resolve one stored token to a descriptor for the in-field preview (?token=…).
aincient_pages.reference_resolve:
  path: '/atelier/reference/resolve'
  defaults:
    _controller: '\Drupal\aincient_pages\Controller\ReferenceController::resolve'
  methods: [GET]
  requirements:
    _permission: 'use aincient studio content'
  options:
    _disable_route_normalizer: 'TRUE'
    _auth: ['cookie', 'basic_auth']

# ── Media upload + token resolution (chat console) ──────────────────────────
# The two media endpoints every studio needs — creating an image from an
# upload (the picker's upload leg) and resolving a token to a derivative URL.
# Browse + preview go through the unified reference API above; the agent's
# find_reference tool reads the same library. The ONE-ITEM EDITING routes
# (detail / save / replace / delete) are the Library studio's and live in
# web/modules/studio/aincient_studio_media (plans/studio-modules.md Phase E).

# Upload a new image into the library (multipart: file + optional alt).
aincient_pages.media_upload:
  path: '/atelier/media/upload'
  defaults:
    _controller: '\Drupal\aincient_pages\Controller\MediaController::upload'
  methods: [POST]
  requirements:
    _permission: 'use aincient studio content'
  options:
    # JSON/data API for the console SPA — never let a (future) redirect-module
    # route normalizer 301 these: a 301 on a POST drops the body and breaks the
    # call. Language is always an explicit `langcode` param, never negotiated.
    _disable_route_normalizer: 'TRUE'
    _auth: ['cookie', 'basic_auth']

# Resolve a media token to a display-sized derivative (?token=…&style=…) — the
# Presence preview cards render at real card size, where a picker thumb is blurry.
aincient_pages.media_url:
  path: '/atelier/media/url'
  defaults:
    _controller: '\Drupal\aincient_pages\Controller\MediaController::url'
  methods: [GET]
  requirements:
    _permission: 'use aincient studio content'
  options:
    _disable_route_normalizer: 'TRUE'
    _auth: ['cookie', 'basic_auth']

# The no-AI design-system editor.
aincient_pages.brand_form:
  path: '/admin/config/content/atelier-brand'
  defaults:
    _form: '\Drupal\aincient_pages\Form\BrandForm'
    _title: 'AIncient brand'
  requirements:
    _permission: 'administer aincient pages'

# Brand revision history (snapshot-on-save) + one-click restore.
aincient_pages.brand_history:
  path: '/admin/config/content/atelier-brand/history'
  defaults:
    _controller: '\Drupal\aincient_pages\Controller\BrandHistoryController::list'
    _title: 'Brand history'
  requirements:
    _permission: 'administer aincient pages'

aincient_pages.brand_restore:
  path: '/admin/config/content/atelier-brand/history/{revision}/restore'
  defaults:
    _form: '\Drupal\aincient_pages\Form\BrandRestoreForm'
    _title: 'Restore brand'
  requirements:
    _permission: 'administer aincient pages'
    revision: '\d+'

# Collection listings (DECISIONS 0329). Content-addressed by query hash; served
# live and replayed into the static export. The JSON MUST stay cacheable
# (CacheableJsonResponse) or the page cache silently refuses it.
aincient_pages.collection_data:
  # The .json is part of the {file} VALUE, not a static path suffix: Drupal's
  # route-provider outline matching can't find a placeholder combined with a
  # static suffix in one segment (unlike a whole-segment placeholder). The
  # controller strips it back to the hash.
  path: '/_data/collections/{file}'
  defaults:
    _controller: '\Drupal\aincient_pages\Controller\CollectionDataController::data'
  methods: [GET]
  requirements:
    _access: 'TRUE'
    file: '[0-9a-f]{16}\.json'
  options:
    _disable_route_normalizer: 'TRUE'
aincient_pages.collection_archive:
  path: '/collections/{hash}/archive'
  defaults:
    _controller: '\Drupal\aincient_pages\Controller\CollectionDataController::archive'
    _title: 'Archive'
  methods: [GET]
  requirements:
    _access: 'TRUE'
    hash: '[0-9a-f]{16}'
  options:
    _disable_route_normalizer: 'TRUE'

# --- Dev-mode-only endpoints (W9, plans/byo-components.md) -------------------
# The pack developer's ground-truth surface, proxied by `atelier mcp`. Every
# route is gated on `_atelier_dev` (AtelierDevAccessCheck): the flag comes only
# from the AINCIENT_DEV env var, which only the `atelier pack dev` compose
# overlay sets — on a production appliance these 403 for everyone. Session-less
# by design so a coding agent can call them without Drupal credentials.
aincient_pages.dev_catalog:
  path: '/atelier/dev/catalog'
  defaults:
    _controller: '\Drupal\aincient_pages\Controller\PackDevController::catalog'
  methods: [GET]
  requirements:
    _atelier_dev: 'TRUE'
  options:
    no_cache: 'TRUE'
aincient_pages.dev_pack_validate:
  path: '/atelier/dev/pack-validate'
  defaults:
    _controller: '\Drupal\aincient_pages\Controller\PackDevController::packValidate'
  methods: [GET]
  requirements:
    _atelier_dev: 'TRUE'
  options:
    no_cache: 'TRUE'
aincient_pages.dev_kind_check:
  path: '/atelier/dev/kind-check'
  defaults:
    _controller: '\Drupal\aincient_pages\Controller\PackDevController::kindCheck'
  methods: [GET]
  requirements:
    _atelier_dev: 'TRUE'
  options:
    no_cache: 'TRUE'
aincient_pages.dev_prompt_manifest:
  path: '/atelier/dev/prompt-manifest'
  defaults:
    _controller: '\Drupal\aincient_pages\Controller\PackDevController::promptManifest'
  methods: [GET]
  requirements:
    _atelier_dev: 'TRUE'
  options:
    no_cache: 'TRUE'
aincient_pages.dev_agent_eval:
  path: '/atelier/dev/agent-eval'
  defaults:
    _controller: '\Drupal\aincient_pages\Controller\PackDevController::agentEval'
  methods: [GET]
  requirements:
    _atelier_dev: 'TRUE'
  options:
    no_cache: 'TRUE'
aincient_pages.dev_design_tokens:
  path: '/atelier/dev/design-tokens'
  defaults:
    _controller: '\Drupal\aincient_pages\Controller\PackDevController::designTokens'
  methods: [GET]
  requirements:
    _atelier_dev: 'TRUE'
  options:
    no_cache: 'TRUE'
aincient_pages.dev_render_example:
  path: '/atelier/dev/render'
  defaults:
    _controller: '\Drupal\aincient_pages\Controller\PackDevController::renderExample'
  methods: [GET]
  requirements:
    _atelier_dev: 'TRUE'
  options:
    no_cache: 'TRUE'
aincient_pages.pack_gallery:
  path: '/atelier/packs/{module}/gallery'
  defaults:
    _controller: '\Drupal\aincient_pages\Controller\PackDevController::gallery'
  methods: [GET]
  requirements:
    _atelier_dev: 'TRUE'
    module: '[a-z][a-z0-9_]*'
  options:
    no_cache: 'TRUE'
