name: 'AIncient Core'
type: module
description: 'Foundational module for Atelier: shared permissions and base services for the AI operator console. Feature code lives in aincient_chat, aincient_flows, aincient_pages, etc.'
package: AIncient
core_version_requirement: ^11
# NOTE: there is deliberately NO `- ai:ai` here any more. Inference runs on our
# own adapters (Inference/) over symfony/ai, and the last reason to keep drupal/ai
# — the role layer projecting its bindings onto `ai.settings`' operation-type
# defaults — was a write with no reader once the ai_provider_* modules and
# flowdrop_ai_provider were uninstalled. Roles resolve through ModelRoleResolver.
# NOTE: we do NOT hard-depend on flowdrop either, even though
# AincientCoreServiceProvider binds `flowdrop.chat_reasoner` to our reasoner: the
# bind is guarded by hasDefinition(), so aincient_core stays installable (and
# unit-testable) without it. In the distribution it is always present.
# `file` IS a hard dependency, unlike the above: the private context store's
# ledger entity (ContextLedgerEntry) references File entities, so the module is
# not installable without it, and token/pathauto walk its fields on any node
# save. It is a core module (always present via media) — this only makes the
# real coupling explicit so the installer enables it and tests resolve it.
dependencies:
  - drupal:file
