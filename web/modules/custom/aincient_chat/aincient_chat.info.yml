name: 'AIncient Chat'
type: module
description: 'The AIncient chat layer: a streaming chat adapter/processor, the hybrid router, Thread/Turn persistence, and the typed event protocol the assistant-ui console consumes.'
package: AIncient
core_version_requirement: ^11
dependencies:
  # No `- ai`: the chat layer reasons through aincient_core's own symfony/ai
  # adapters. It carried the dependency for the onboarding gate, which read
  # `ai.settings:default_providers.chat` — that now asks the role layer instead.
  - key
  - aincient_core
