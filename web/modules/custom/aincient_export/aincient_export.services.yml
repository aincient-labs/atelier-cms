services:
  aincient_export.path_inventory:
    class: Drupal\aincient_export\PathInventory
    arguments: ['@entity_type.manager', '@config.factory', '@language_manager', '@?aincient_pages.collection_inventory']
  aincient_export.static_renderer:
    class: Drupal\aincient_export\StaticRenderer
    arguments: ['@http_kernel', '@request_stack', '@account_switcher', '@?http_middleware.page_cache']
  aincient_export.link_checker:
    class: Drupal\aincient_export\LinkChecker
  aincient_export.packager:
    class: Drupal\aincient_export\Packager
    arguments: ['@entity_type.manager']
  aincient_export.exporter:
    class: Drupal\aincient_export\Exporter
    arguments:
      - '@aincient_export.path_inventory'
      - '@aincient_export.static_renderer'
      - '@aincient_export.link_checker'
      - '@aincient_export.packager'
      - '@entity_type.manager'
      - '@module_handler'
  aincient_export.snapshot_store:
    class: Drupal\aincient_export\SnapshotStore
    arguments: ['@aincient_export.exporter', '@datetime.time']
  # /atelier/snapshots/<id>/<deep/file/path> → the snapshot-file route + ?file=.
  # Drupal's router matches a `.*` slug one segment deep only (see the class).
  aincient_export.path_processor.snapshots:
    class: Drupal\aincient_export\PathProcessor\SnapshotPathProcessor
    tags:
      - { name: path_processor_inbound, priority: 200 }
