global:
  version: 1.x
  css:
    theme:
      # The console's design tokens, generated from aincient_core/tokens/*.json
      # by the chat-ui build (docs/console-tokens.md). First, so the two files
      # below only ever read them.
      css/tokens.generated.css: {}
      css/studio-backend.css: {}
      css/admin-kit.css: {}
  dependencies:
    # Self-hosted brand fonts (Fraunces display serif + grotesk), shared with
    # the console — the backend serif is the real thing, not the Palatino
    # fallback, and leaks no operator IP to Google.
    - aincient_chat/fonts
