tokens:
  neutral_surface: '#FAF6EF'
  neutral_subtle: '#F0EBE3'
  neutral_muted_foreground: '#5A5047'
  neutral_ink: '#241E18'
  card: var(--neutral-surface)
  brand_primary: '#1F3D3D'
  brand_primary_foreground: '#FAF6EF'
  brand_accent: var(--color-yellow-700)
  brand_accent_foreground: '#FAF6EF'
  neutral_border: '#E8E1D7'
  font_family_base: '"Lora", Georgia, "Times New Roman", serif'
  font_family_display: 'Cormorant Garamond'
  radius_sm: 0.375rem
  radius_md: 0.5rem
  radius_lg: 0.75rem
  radius_xl: 1rem
  radius_2xl: 1.5rem
  shadow_distance: 6px
  shadow_blur: 14px
  shadow_strength: '0.12'
  shadow_dir_x: '0.71'
