id: aincient_brand_specialist_colour
label: 'Brand specialist: Colour & contrast'
description: 'Single-pass colour & contrast specialist. Takes a colour instruction plus the authoritative current look (injected deterministically, not model-authored), decides a complete contrast-safe palette, and returns a brand-preview slice (tokens_json) for the orchestrator to apply via preview_brand. Applies nothing itself; no inner loop.'
