created: 1791291110
changed: 1791324019
uid: 1
input_ports:
  -
    name: system_prompt
    node_id: text_input.1
    port: data
    title: 'System prompt'
    description: "The studio's instructions."
  -
    name: message
    node_id: aincient_flows_aincient_conversation_append.1
    port: content
    title: Message
    description: "The user's turn, appended to the session conversation."
  -
    name: tool
    node_id: flowdrop_node_processor_toolbox.1
    port: tool
    title: Tools
    description: 'Tool nodes in the parent graph; wiring one here exposes it to the model.'
  -
    name: operation_type
    node_id: aincient_reason.2
    port: operation_type
    title: 'Model role'
    description: "Which model role / operation type resolves this node's model when no explicit model is set."
  -
    name: approval_tools
    node_id: aincient_flows_approval_gate.1
    port: approval_tools
    title: 'Tools that need approval'
    description: 'Comma-separated capability_* tool names. Empty = never ask.'
  -
    name: context
    node_id: text_input.2
    port: data
    title: Context
    description: 'Optional material for the model, sent in its own <context> block after the prompt. Empty = no block.'
output_ports:
  -
    name: message
    node_id: text_output.1
    port: text
  -
    name: scratchpad
    node_id: aincient_flows_aincient_conversation_read.2
    port: messages
parameter_schema:
  type: object
  properties:
    system_prompt:
      title: 'System prompt'
      description: "The studio's instructions."
      x-data-type: mixed
    message:
      title: Message
      description: "The user's turn, appended to the session conversation."
      x-data-type: mixed
    tool:
      title: Tools
      description: 'Tool nodes in the parent graph; wiring one here exposes it to the model.'
      x-data-type: tool
    operation_type:
      type: string
      title: 'Model role'
      description: "Which model role / operation type resolves this node's model when no explicit model is set."
      enum:
        - chat
        - 'aincient_role:reasoning'
        - 'aincient_role:task'
        - 'aincient_role:fast'
      x-data-type: string
      default: chat
    approval_tools:
      type: string
      title: 'Tools that need approval'
      description: 'Comma-separated capability_* tool names. Empty = never ask.'
      x-data-type: string
      default: ''
    context:
      title: Context
      description: 'Optional material for the model, sent in its own <context> block after the prompt. Empty = no block.'
      x-data-type: mixed
output_schema:
  type: object
  properties:
    message:
      type: string
      x-data-type: string
    scratchpad:
      type: array
      x-data-type: messages
schema_version: 2.1.1
