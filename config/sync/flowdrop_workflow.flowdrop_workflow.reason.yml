id: reason
label: Reason
description: 'One tool-aware agent step, wrapped so every agent shares one recovery policy. The tier is a per-placement setting (operation_type) resolved through aincient_core.model_roles, so one wrapper serves the fast, task and reasoning tiers. The inner node''s error port is exposed and unwired: that seam is where semantic recovery belongs, but NOT a Delay loop-back — an interrupt node resumes on cron, so on a chat turn it renders a "Waiting until …" card instead of an answer and the next user message cancels the pending run. Same-second blips are already absorbed in PHP by ProviderCall; what is still owed here is a stop-and-report path that lets the run finish with the failure as its reply.'
