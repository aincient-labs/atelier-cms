parameter_schema:
  type: object
  required:
    - ask
  properties:
    ask:
      type: string
      description: 'The typography instruction to act on — what the user wants for typefaces / type scale. Pass the typography-relevant part of the request only; do NOT restate current values (the authoritative current look is supplied separately via current_state).'
      default: ''
      required: true
    current_state:
      type: object
      description: 'The authoritative current look (saved-brand brief + live preview draft), injected from the brand_state node — NOT model-authored. Wire a data edge into this port; it is withheld from the model and supplied deterministically from run state.'
      required: false
output_schema:
  type: object
  properties:
    slice:
      type: string
schema_version: 1.0.0
