id: workshop_one_ai_call
label: 'Workshop — one AI call'
description: 'Recording asset for The Workshop episode "What one AI call actually looks like". One stateless inference with NO tools, NO memory and NO loop: the conversation is typed by hand as JSON so the exact payload sent to the model is visible on screen. Deliberately avoids the convenience chat steps, which hide it. Lives on branch workshop/one-ai-call and must never be merged — it is a teaching artifact, not product config.'
