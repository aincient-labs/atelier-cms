label: 'Capability: Propose design tokens'
description: 'Propose design tokens you extracted from an attached design file (e.g. design.md), surfaced to the user as a confirm card ("N tokens found") with Preview and Apply-to-brand buttons. Use this — NOT preview_brand — when the tokens come from a file the operator attached this turn. It applies NOTHING: Preview lets the user see them live, Apply is the user''s click. Pass tokens_json (a JSON object of {token_name: css_value}) and/or presets_json, plus the source filename. Token names + accepted value types are listed in the system prompt.'
